# Serves the compiled frontend and forwards API calls to the backend.
#
# Keeping the API on the same origin as the app means the browser never
# makes a cross-origin request, so CORS cannot break in production.

upstream backend {
    # `backend` is the Docker Compose service name.
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Large uploads need room; the backend enforces its own limit too.
    client_max_body_size 25m;

    # Don't advertise the server version.
    server_tokens off;

    # Basic hardening headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # Hashed build assets never change, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        # Uploads can be slow; don't let nginx cut them off early.
        proxy_request_buffering off;
    }

    # Let the SPA handle its own routing: every unknown path returns
    # index.html so a deep link such as /settings works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
