# Rendered through /etc/nginx/templates so ${PORT} and ${BACKEND_URL}
# are substituted at container start.
#
#   compose  -> BACKEND_URL defaults to backend:8000
#   Railway  -> BACKEND_URL = https://<your-backend-service>.up.railway.app
#
# Hosts such as Railway and Render inject PORT and route public traffic
# there, so nginx listens on ${PORT} rather than a hardcoded number.

upstream aksidhi_api {
    server ${BACKEND_URL};
    keepalive 16;
}

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Large uploads need room; the backend enforces its own limit too.
    client_max_body_size 25m;

    # Don't advertise the server version.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # Hashed build assets never change, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API is same-origin, so the browser never makes a cross-origin
    # request and CORS cannot break.
    location /api/ {
        proxy_pass         http://aksidhi_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        # Uploads can be slow; don't let nginx cut them off early.
        proxy_request_buffering off;
    }

    # Let the SPA handle its own routing so /settings survives a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
