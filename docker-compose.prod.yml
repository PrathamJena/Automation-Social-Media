# Production stack.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml:
#   - the frontend is a compiled nginx build, not the Vite dev server
#   - the backend runs without --reload and applies migrations on start
#   - only the web app is published, so the database is never exposed
#
# Secrets come from the environment (or a .env file in this directory).

services:
  postgres:
    image: postgres:16-alpine
    container_name: aksidhi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: aksidhi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aksidhi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aksidhi-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aksidhi
      REDIS_URL: redis://redis:6379/0
      REDIS_CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Required in production; the app refuses to start without it.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-aksidhi-media}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
      # Used by: python -m app.scripts.seed_admin
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set for seeding}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aksidhi-frontend
    restart: unless-stopped
    ports:
      # Only the web app is reachable from outside.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aksidhi-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aksidhi
      REDIS_URL: redis://redis:6379/0
      REDIS_CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aksidhi-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aksidhi
      REDIS_URL: redis://redis:6379/0
      REDIS_CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
